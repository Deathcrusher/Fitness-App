<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">FitFlow</title>
  <desc id="desc">FitFlow Logo mit stilisierter Hantel und Bewegungslinie</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ed"/>
      <stop offset="1" stop-color="#fff3ef"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7667"/>
      <stop offset="1" stop-color="#78a06d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#20342d" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="760" height="480" rx="38" fill="url(#bg)"/>
  <circle cx="380" cy="190" r="112" fill="#fff" opacity=".82" filter="url(#shadow)"/>

  <g fill="url(#mark)">
    <rect x="286" y="173" width="188" height="34" rx="17"/>
    <rect x="268" y="143" width="34" height="94" rx="13"/>
    <rect x="242" y="158" width="25" height="64" rx="10"/>
    <rect x="458" y="143" width="34" height="94" rx="13"/>
    <rect x="493" y="158" width="25" height="64" rx="10"/>
  </g>

  <path d="M238 258c36 0 45-30 72-30 31 0 37 54 69 54 29 0 40-78 68-78 25 0 31 54 73 54" fill="none" stroke="#f26f5d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="520" cy="258" r="7" fill="#f26f5d"/>

  <text x="380" y="378" text-anchor="middle" fill="#18352d" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="850" letter-spacing="-4">Fit<tspan fill="#f26f5d">Flow</tspan></text>
</svg>
