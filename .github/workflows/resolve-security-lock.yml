name: Resolve security lockfile (temporary)
on:
  push:
    branches: [security/fitflow-hardening]
permissions:
  contents: read
jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --save-exact vite@8.3.8
      - run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact vitest@5.1.2
      - run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lock
          path: |
            package.json
            package-lock.json
  commit:
    needs: resolve
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lock
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Update and verify dependency lockfile"
          git push origin HEAD:refs/heads/security/fitflow-hardening
